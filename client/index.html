<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.bunny.net">
	<link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700" rel="stylesheet">
	<link rel="stylesheet" href="/app.css">
	<script>
		(function () {
			function apply(theme) {
				var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
			}
			window.__applyTheme = apply;
			apply(localStorage.getItem('theme') || 'system');
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
				if ((localStorage.getItem('theme') || 'system') === 'system') apply('system');
			});
		})();
	</script>
	<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
	<script src="/app.js"></script>
</head>
<body>
	<script>
		var app = Elm.Main.init({
			flags: { language: localStorage.getItem('lang') || navigator.language, theme: localStorage.getItem('theme') || 'system', height: window.innerHeight }
		});
		app.ports.setLanguage.subscribe(function (code) {
			localStorage.setItem('lang', code);
			document.documentElement.lang = code;
		});
		app.ports.setTheme.subscribe(function (theme) {
			localStorage.setItem('theme', theme);
			window.__applyTheme(theme);
		});

		// The websocket. Elm asks to connect once signed in and to disconnect on
		// sign-out. While a connection is wanted, a dropped socket reconnects with
		// a growing delay. The me poll keeps the cookie fresh, so each reconnect
		// handshake passes auth.
		var socket = null;
		var wsWanted = false;
		var wsRetry = 500;

		function openSocket() {
			var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
			socket = new WebSocket(proto + '//' + location.host + '/api/v1/ws');
			socket.onopen = function () {
				wsRetry = 500;
			};
			socket.onmessage = function (event) {
				app.ports.socketMessage.send(event.data);
			};
			socket.onclose = function () {
				socket = null;
				if (wsWanted) {
					setTimeout(openSocket, wsRetry);
					wsRetry = Math.min(wsRetry * 2, 10000);
				}
			};
		}

		app.ports.connectSocket.subscribe(function () {
			wsWanted = true;
			if (!socket) openSocket();
		});

		app.ports.disconnectSocket.subscribe(function () {
			wsWanted = false;
			if (socket) socket.close();
		});

		app.ports.sendSocket.subscribe(function (data) {
			if (socket && socket.readyState === WebSocket.OPEN) socket.send(data);
		});
	</script>
</body>
</html>
