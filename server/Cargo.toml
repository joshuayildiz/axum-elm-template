[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["password"] }
dotenvy = "0.15.7"
elm_rs = "0.2.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid"] }
tokio = { version = "1.53.1", features = ["net", "rt"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = "1.26.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
